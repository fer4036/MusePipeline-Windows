services:
  - type: web
    name: muse-research-cloud
    runtime: docker
    branch: feature/windows-cloud-agent
    dockerfilePath: ./Dockerfile.cloud
    autoDeployTrigger: commit
    healthCheckPath: /health
    numInstances: 1
    maxShutdownDelaySeconds: 60
    envVars:
      - key: MUSE_CLOUD_RESEARCHER_TOKEN
        sync: false
      - key: MUSE_CLOUD_AGENT_TOKENS
        sync: false
      - key: MUSE_CLOUD_OPERATOR_TOKEN
        sync: false
